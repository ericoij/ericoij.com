name: Update upper-air observations

on:
  schedule:
    - cron: "45 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run weather:update

      - name: Commit fresh observations
        run: |
          if git diff --quiet -- public/data/weather-model.json; then
            echo "Observation data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/weather-model.json
          git commit -m "Update upper-air observations"
          git push
